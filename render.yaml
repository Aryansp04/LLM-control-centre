databases:
  - name: llmcc-postgres
    plan: basic-256mb
    databaseName: llm_control_center
    user: llmcc

services:
  - type: redis
    name: llmcc-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: llm-control-center-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: llmcc-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: llmcc-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
